name: Unity Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 2021.3.45f2
          buildName: "Protobot Rebuilt"

      - name: Install NSIS
        run: sudo apt-get install -y nsis

      - name: Create NSIS Installer
        run: makensis installer.nsi

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ProtobotRebuilt-Installer
          path: ProtobotRebuilt-Installer.exe
